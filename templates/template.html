<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - 1Cat-vLLM 源码精读讲义</title>
    <!-- MathJax for rendering LaTeX formulas offline/online gracefully -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            chtml: {
                matchFontHeight: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js';"></script>
    <!-- Highlight.js for code syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* LaTeX 讲义白底主题 (默认，还原 wdkns-skills xelatex 视觉体验) */
        :root[data-theme="paper"] {
            --bg-color: #ffffff;
            --surface-color: #f8fafc;
            --surface-elevated: #f1f5f9;
            --border-color: #cbd5e1;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #64748b;
            --accent-primary: #1d4ed8;
            --accent-glow: rgba(29, 78, 216, 0.07);
            --code-bg: #f1f5f9;
            --code-text: #991b1b;
            --pre-bg: #fafafa;
            --pre-text: #1f2937;
            --table-header: #f1f5f9;
            --table-alt: #f8fafc;
            --toggle-bg: #f1f5f9;
            /* tcolorbox 配色：严格对应 notes-template.tex */
            --tcb-imp-bg: #fefce8;
            --tcb-imp-frame: #ca9a04;
            --tcb-imp-title-bg: #d4a506;
            --tcb-imp-title-fg: #111827;
            --tcb-know-bg: #f3f6fc;
            --tcb-know-frame: #1e40af;
            --tcb-know-title-bg: #1e40af;
            --tcb-know-title-fg: #ffffff;
            --tcb-warn-bg: #fef2f2;
            --tcb-warn-frame: #b91c1c;
            --tcb-warn-title-bg: #b91c1c;
            --tcb-warn-title-fg: #ffffff;
            --tcb-dial-bg: #f2fbf5;
            --tcb-dial-frame: #2f7347;
            --tcb-dial-title-bg: #2f7347;
            --tcb-dial-title-fg: #ffffff;
            --meta-box-bg: #fafafa;
            --meta-box-frame: #52525b;
        }

        /* 暖阳米纸主题 (护眼模式) */
        :root[data-theme="parchment"] {
            --bg-color: #f7f4ec;
            --surface-color: #eee9dc;
            --surface-elevated: #e6dfcf;
            --border-color: #dcd4c0;
            --text-primary: #2d3748;
            --text-secondary: #5c687a;
            --text-muted: #798696;
            --accent-primary: #a35d28;
            --accent-glow: rgba(163, 93, 40, 0.08);
            --code-bg: #eae3d2;
            --code-text: #8d3a2b;
            --pre-bg: #f3efe4;
            --pre-text: #2d3748;
            --table-header: #e4dccb;
            --table-alt: #f1ecdf;
            --toggle-bg: #dfd6c2;
            --tcb-imp-bg: #f8f2d8;
            --tcb-imp-frame: #c4960c;
            --tcb-imp-title-bg: #cfa010;
            --tcb-imp-title-fg: #1a202c;
            --tcb-know-bg: #eaeff7;
            --tcb-know-frame: #254b8c;
            --tcb-know-title-bg: #254b8c;
            --tcb-know-title-fg: #ffffff;
            --tcb-warn-bg: #f9ebe8;
            --tcb-warn-frame: #b02a2a;
            --tcb-warn-title-bg: #b02a2a;
            --tcb-warn-title-fg: #ffffff;
            --tcb-dial-bg: #eaf3ec;
            --tcb-dial-frame: #346b48;
            --tcb-dial-title-bg: #346b48;
            --tcb-dial-title-fg: #ffffff;
            --meta-box-bg: #f2ede2;
            --meta-box-frame: #6b6356;
        }

        /* 薄暮夜读主题 */
        :root[data-theme="twilight"] {
            --bg-color: #1a1e24;
            --surface-color: #232931;
            --surface-elevated: #2c343f;
            --border-color: #39424e;
            --text-primary: #dce1e8;
            --text-secondary: #9da7b3;
            --text-muted: #707b88;
            --accent-primary: #e09f67;
            --accent-glow: rgba(224, 159, 103, 0.1);
            --code-bg: #15181d;
            --code-text: #f08d70;
            --pre-bg: #171b21;
            --pre-text: #cdd3dc;
            --table-header: #262e38;
            --table-alt: #1f242c;
            --toggle-bg: #323b47;
            --tcb-imp-bg: #292416;
            --tcb-imp-frame: #b88c14;
            --tcb-imp-title-bg: #b88c14;
            --tcb-imp-title-fg: #111827;
            --tcb-know-bg: #1b2434;
            --tcb-know-frame: #3b66b0;
            --tcb-know-title-bg: #3b66b0;
            --tcb-know-title-fg: #ffffff;
            --tcb-warn-bg: #2c1b1e;
            --tcb-warn-frame: #a83232;
            --tcb-warn-title-bg: #a83232;
            --tcb-warn-title-fg: #ffffff;
            --tcb-dial-bg: #1b2922;
            --tcb-dial-frame: #3a7550;
            --tcb-dial-title-bg: #3a7550;
            --tcb-dial-title-fg: #ffffff;
            --meta-box-bg: #21262e;
            --meta-box-frame: #586374;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Noto Serif CJK SC", "Source Han Serif SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.88;
            padding: 32px 16px;
            font-size: 16px;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .layout-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            max-width: 1380px;
            margin: 0 auto;
            gap: 40px;
            position: relative;
        }

        /* 左侧大纲导航栏 */
        .sidebar-toc {
            width: 285px;
            flex-shrink: 0;
            position: sticky;
            top: 24px;
            max-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            z-index: 90;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .toc-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 48px);
        }

        .toc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .toc-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .toc-title svg {
            color: var(--accent-primary);
        }

        .toc-action-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toc-action-btn:hover {
            background: var(--surface-elevated);
            color: var(--accent-primary);
            border-color: var(--border-color);
        }

        .toc-body {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .toc-body::-webkit-scrollbar { width: 5px; }
        .toc-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-item { margin: 2px 0; line-height: 1.4; }
        .toc-level-2 { margin-top: 8px; padding-left: 0; }
        .toc-level-3 { padding-left: 14px; }
        .toc-level-4 { padding-left: 26px; }

        .toc-link {
            display: block;
            padding: 5px 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 2px solid transparent;
        }

        .toc-level-2 > .toc-link { font-weight: 600; font-size: 0.87rem; }
        .toc-level-3 > .toc-link { font-size: 0.82rem; }
        .toc-level-4 > .toc-link { font-size: 0.79rem; color: var(--text-muted); }

        .toc-link:hover { color: var(--accent-primary); background: var(--accent-glow); }
        .toc-link.active {
            color: var(--accent-primary);
            background: var(--accent-glow);
            border-left-color: var(--accent-primary);
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            max-width: 940px;
        }

        .container { max-width: 100%; margin: 0 auto; }

        body.toc-collapsed .sidebar-toc { display: none; }
        body.toc-collapsed #expandTocBtn { display: inline-flex !important; }

        .mobile-toc-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 999;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }

        .toc-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 990;
        }

        @media (max-width: 1120px) {
            .sidebar-toc {
                position: fixed;
                top: 0;
                left: -320px;
                width: 300px;
                height: 100vh;
                max-height: 100vh;
                z-index: 1000;
                padding: 16px;
                background: var(--bg-color);
            }
            .sidebar-toc.open { left: 0; box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2); }
            .mobile-toc-toggle { display: inline-flex; }
            body.toc-drawer-open .toc-backdrop { display: block; }
            #expandTocBtn { display: none !important; }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        }

        .nav-links { display: flex; gap: 10px; align-items: center; }

        .nav-btn, .theme-switch-btn {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.84rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-btn:hover, .theme-switch-btn:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        /* --- wdkns-skills Titlepage 风格头部与元数据框 --- */
        .lecture-titlepage {
            text-align: center;
            padding: 28px 16px 32px;
            margin-bottom: 36px;
            border-bottom: 1.5px solid var(--border-color);
        }

        .lecture-series-tag {
            font-size: 1.05rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .lecture-main-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.35;
            margin-bottom: 14px;
            border: none;
            padding: 0;
        }

        .lecture-subtitle {
            font-size: 1.22rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 500;
        }

        .lecture-author-date {
            font-size: 0.96rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .lecture-meta-box {
            max-width: 840px;
            margin: 0 auto;
            text-align: left;
            background-color: var(--meta-box-bg);
            border: 1.5px solid var(--meta-box-frame);
            padding: 16px 22px;
            font-size: 0.92rem;
            line-height: 1.75;
            border-radius: 1px;
        }

        .lecture-meta-row {
            margin-bottom: 4px;
        }
        .lecture-meta-row:last-child {
            margin-bottom: 0;
        }

        /* --- 章节标题排版 (模拟 LaTeX \section / \subsection) --- */
        h1, h2, h3, h4, h5, h6 {
            scroll-margin-top: 32px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        }

        h1 {
            font-size: 2.05rem;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.35;
            font-weight: 700;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 48px;
            margin-bottom: 18px;
            padding-bottom: 8px;
            color: var(--text-primary);
            border-bottom: 1.5px solid var(--border-color);
            font-weight: 700;
        }

        h3 {
            font-size: 1.18rem;
            margin-top: 28px;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-weight: 700;
        }

        h4 {
            font-size: 1.03rem;
            margin-top: 20px;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-weight: 700;
        }

        p {
            margin-bottom: 16px;
            color: var(--text-primary);
            text-align: justify;
        }

        ul, ol {
            margin-bottom: 18px;
            padding-left: 26px;
        }

        li {
            margin-bottom: 7px;
            color: var(--text-primary);
        }

        /* --- wdkns-skills tcolorbox 四大高亮框 --- */
        .tcolorbox {
            margin: 24px 0;
            border-radius: 1px; /* sharp corners */
            position: relative;
        }

        .tcolorbox-title {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-weight: 700;
            font-size: 0.96rem;
            line-height: 1.4;
        }

        .tcolorbox-body {
            padding: 14px 18px;
            font-size: 0.96rem;
            line-height: 1.8;
        }

        .tcolorbox-body p:last-child,
        .tcolorbox-body ul:last-child,
        .tcolorbox-body ol:last-child {
            margin-bottom: 0;
        }

        /* 1. importantbox: 黄底黄框，顶部通栏黑字粗体标题 */
        .tcolorbox-important {
            background-color: var(--tcb-imp-bg);
            border: 1.5px solid var(--tcb-imp-frame);
        }
        .tcolorbox-important > .tcolorbox-title {
            background-color: var(--tcb-imp-title-bg);
            color: var(--tcb-imp-title-fg);
            padding: 6px 16px;
        }

        /* 2. knowledgebox: 蓝底蓝框，左上角悬浮标签式标题 (attach boxed title to top left) */
        .tcolorbox-knowledge {
            background-color: var(--tcb-know-bg);
            border: 1.5px solid var(--tcb-know-frame);
            margin-top: 32px;
        }
        .tcolorbox-knowledge > .tcolorbox-title {
            display: inline-block;
            background-color: var(--tcb-know-title-bg);
            color: var(--tcb-know-title-fg);
            padding: 3px 14px;
            margin-top: -14px;
            margin-left: 12px;
            transform: translateY(-50%);
            margin-bottom: -10px;
            border-radius: 1px;
        }
        .tcolorbox-knowledge > .tcolorbox-body {
            padding-top: 6px;
        }

        /* 3. warningbox: 红底红框，顶部通栏白字粗体标题 */
        .tcolorbox-warning {
            background-color: var(--tcb-warn-bg);
            border: 1.5px solid var(--tcb-warn-frame);
        }
        .tcolorbox-warning > .tcolorbox-title {
            background-color: var(--tcb-warn-title-bg);
            color: var(--tcb-warn-title-fg);
            padding: 6px 16px;
        }

        /* 4. dialoguebox: 绿底绿框，顶部通栏白字粗体标题 */
        .tcolorbox-dialogue {
            background-color: var(--tcb-dial-bg);
            border: 1.5px solid var(--tcb-dial-frame);
        }
        .tcolorbox-dialogue > .tcolorbox-title {
            background-color: var(--tcb-dial-title-bg);
            color: var(--tcb-dial-title-fg);
            padding: 6px 16px;
        }

        /* --- 公式块与符号解释列表 --- */
        .math-display-block {
            text-align: center;
            margin: 18px 0 14px;
            padding: 6px 0;
            font-size: 1.08em;
            overflow-x: auto;
        }

        /* --- 配图与底部源码溯源角标 (Figure + Provenance) --- */
        .lecture-figure {
            margin: 34px 0 38px;
            text-align: center;
            clear: both;
        }

        .lecture-figure img,
        .lecture-figure svg {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            display: block;
            margin: 0 auto 14px;
        }

        .lecture-figure foreignObject {
            overflow: visible;
        }

        .lecture-figure .svg-latex {
            font-family: "Noto Serif CJK SC", "Times New Roman", -apple-system, "PingFang SC", serif;
            text-align: center;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .lecture-figure .svg-latex mjx-container {
            margin: 0 !important;
            padding: 0 !important;
            display: inline-block !important;
            color: inherit !important;
        }

        .lecture-figcaption {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 5px;
            line-height: 1.5;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }

        .lecture-fig-provenance {
            font-size: 0.81rem;
            color: var(--text-muted);
            line-height: 1.45;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }

        /* --- 代码块 (LaTeX lstlisting 风格：带行号、单线框、底部 Listing Caption 与源码溯源) --- */
        code {
            font-family: "JetBrains Mono", Consolas, Menlo, Monaco, monospace;
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.87em;
        }

        .lstlisting-wrapper {
            margin: 24px 0;
        }

        .code-block {
            background-color: var(--pre-bg);
            border: 1px solid var(--meta-box-frame);
            border-radius: 1px;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 12px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.76rem;
            font-family: "JetBrains Mono", Consolas, monospace;
            user-select: none;
        }

        .code-lang {
            font-weight: 700;
            color: var(--text-secondary);
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-muted);
            padding: 2px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .code-table-wrap {
            display: flex;
            overflow-x: auto;
            padding: 12px 0;
        }

        .line-numbers {
            user-select: none;
            text-align: right;
            padding: 0 12px 0 10px;
            color: var(--text-muted);
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 0.8rem;
            line-height: 1.65;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        pre {
            background-color: transparent;
            border: none;
            padding: 0 16px;
            margin: 0;
            line-height: 1.65;
            flex: 1;
            min-width: 0;
        }

        pre code {
            background-color: transparent;
            color: var(--pre-text);
            padding: 0;
            font-size: 0.88rem;
            font-family: "JetBrains Mono", Consolas, monospace;
            display: block;
        }

        .lstlisting-caption {
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-primary);
            margin-top: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }

        .lstlisting-provenance {
            text-align: center;
            font-size: 0.79rem;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        }

        /* 语法高亮样式 */
        :root[data-theme="paper"] .hljs-comment,
        :root[data-theme="parchment"] .hljs-comment { color: #2e7d32; font-style: italic; }
        :root[data-theme="paper"] .hljs-keyword,
        :root[data-theme="parchment"] .hljs-keyword { color: #1d4ed8; font-weight: 600; }
        :root[data-theme="paper"] .hljs-type,
        :root[data-theme="parchment"] .hljs-type { color: #0f766e; font-weight: 600; }
        :root[data-theme="paper"] .hljs-string,
        :root[data-theme="parchment"] .hljs-string { color: #b91c1c; }
        :root[data-theme="paper"] .hljs-number,
        :root[data-theme="parchment"] .hljs-number { color: #b45309; }
        :root[data-theme="paper"] .hljs-title,
        :root[data-theme="parchment"] .hljs-title { color: #1e3a8a; font-weight: 600; }
        :root[data-theme="paper"] .hljs-meta,
        :root[data-theme="parchment"] .hljs-meta { color: #6d28d9; }

        :root[data-theme="twilight"] .hljs-comment { color: #636e7b; font-style: italic; }
        :root[data-theme="twilight"] .hljs-keyword { color: #e09f67; font-weight: 600; }
        :root[data-theme="twilight"] .hljs-type { color: #e5c07b; font-weight: 600; }
        :root[data-theme="twilight"] .hljs-string { color: #98c379; }
        :root[data-theme="twilight"] .hljs-number { color: #d19a66; }
        :root[data-theme="twilight"] .hljs-title { color: #61afef; font-weight: 600; }

        blockquote {
            background-color: var(--surface-color);
            border-left: 3.5px solid var(--border-color);
            padding: 12px 18px;
            margin: 18px 0;
            color: var(--text-secondary);
        }

        /* 学术三线表风格 (booktabs) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 0.93rem;
            border-top: 2px solid var(--text-primary);
            border-bottom: 2px solid var(--text-primary);
        }

        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--table-header);
            color: var(--text-primary);
            font-weight: 700;
            border-bottom: 1.5px solid var(--text-primary);
        }

        tr:nth-child(even) {
            background-color: var(--table-alt);
        }

        .source-meta {
            background-color: var(--surface-color);
            border: 1px dashed var(--border-color);
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 0.84rem;
            color: var(--text-muted);
            margin-top: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        @media print {
            .sidebar-toc, .top-bar, .mobile-toc-toggle, .source-meta, .copy-btn {
                display: none !important;
            }
            body { padding: 0; font-size: 11pt; }
            .main-content { max-width: 100%; }
            .tcolorbox, .lecture-figure, .lstlisting-wrapper {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <button class="mobile-toc-toggle" onclick="toggleMobileToc()" id="mobileTocBtn" title="展开/收起目录大纲">
        <span>目录</span>
    </button>
    <div class="toc-backdrop" onclick="toggleMobileToc()"></div>

    <div class="layout-wrapper">
        <aside class="sidebar-toc" id="sidebarToc">
            <div class="toc-card">
                <div class="toc-header">
                    <div class="toc-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        <span>目录大纲</span>
                    </div>
                    <button class="toc-action-btn" onclick="toggleDesktopToc()" title="收起大纲">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                </div>
                <nav class="toc-body">
                    {{TOC_CONTENT}}
                </nav>
            </div>
        </aside>

        <main class="main-content">
            <div class="container">
                <div class="top-bar">
                    <div class="nav-links">
                        <button class="nav-btn" id="expandTocBtn" onclick="toggleDesktopToc()" style="display: none;">
                            <span>显示目录</span>
                        </button>
                        <a href="../index.html" class="nav-btn">← 讲义总目录</a>
                        <span style="color: var(--border-color)">|</span>
                        <span style="font-size: 0.84rem; color: var(--text-muted);">{{SOURCE_REL_PATH}}</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="theme-switch-btn" onclick="window.print()" title="导出/打印为 LaTeX 风格 PDF">
                            🖨️ 导出 PDF
                        </button>
                        <button class="theme-switch-btn" onclick="toggleTheme()" id="themeBtn">
                            主题：LaTeX 白底
                        </button>
                    </div>
                </div>

                <article class="markdown-body">
                    {{BODY_CONTENT}}
                </article>

                <div class="source-meta">
                    <span>Markdown 源文件：<code>{{SOURCE_REL_PATH}}</code></span>
                    <span>渲染规范：<code>wdkns-skills (codebase-render-notes &amp; tensor-formula-viz)</code></span>
                </div>

                <footer>
                    <p>1Cat-vLLM 源码精读与算子开发讲义 · <a href="../index.html" style="color: inherit;">返回笔记首页</a></p>
                </footer>
            </div>
        </main>
    </div>

    <script>
        const THEME_ORDER = ['paper', 'parchment', 'twilight'];
        const THEME_LABELS = {
            'paper': '主题：LaTeX 白底',
            'parchment': '主题：暖阳米纸',
            'twilight': '主题：薄暮夜读'
        };

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'paper';
            const nextIdx = (THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length;
            const next = THEME_ORDER[nextIdx];
            html.setAttribute('data-theme', next);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.innerHTML = THEME_LABELS[next];
            localStorage.setItem('doc-theme', next);
        }

        function toggleDesktopToc() {
            const isCollapsed = document.body.classList.toggle('toc-collapsed');
            localStorage.setItem('toc-collapsed', isCollapsed ? 'true' : 'false');
        }

        function toggleMobileToc() {
            const sidebar = document.getElementById('sidebarToc');
            const isOpen = sidebar.classList.toggle('open');
            document.body.classList.toggle('toc-drawer-open', isOpen);
        }

        document.addEventListener('click', function(e) {
            const link = e.target.closest('.toc-link');
            if (link && window.innerWidth <= 1120) {
                const sidebar = document.getElementById('sidebarToc');
                if (sidebar) sidebar.classList.remove('open');
                document.body.classList.remove('toc-drawer-open');
            }
        });

        function initScrollSpy() {
            const links = Array.from(document.querySelectorAll('.toc-link'));
            if (!links.length) return;
            const targets = links.map(link => {
                const href = link.getAttribute('href');
                if (!href || !href.startsWith('#')) return null;
                const id = decodeURIComponent(href.slice(1));
                return { link: link, element: document.getElementById(id) };
            }).filter(item => item && item.element !== null);
            if (!targets.length) return;

            function onScroll() {
                const scrollPos = window.scrollY + 100;
                let currentItem = targets[0];
                for (let i = 0; i < targets.length; i++) {
                    if (targets[i].element.offsetTop <= scrollPos) {
                        currentItem = targets[i];
                    } else {
                        break;
                    }
                }
                targets.forEach(item => {
                    if (item === currentItem) {
                        item.link.classList.add('active');
                    } else {
                        item.link.classList.remove('active');
                    }
                });
            }
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }

        function copyCode(btn) {
            const block = btn.closest('.code-block');
            const code = block ? block.querySelector('pre code') : null;
            if (!code) return;
            const text = code.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const origHtml = btn.innerHTML;
                btn.innerHTML = '<span>已复制!</span>';
                setTimeout(() => { btn.innerHTML = origHtml; }, 1800);
            });
        }

        function initHighlight() {
            if (window.hljs) {
                try {
                    hljs.registerAliases(['cuda', 'cu', 'cuh'], { languageName: 'cpp' });
                } catch(e) {}
                document.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });
            }
        }

        (function() {
            const saved = localStorage.getItem('doc-theme');
            if (saved && THEME_LABELS[saved]) {
                document.documentElement.setAttribute('data-theme', saved);
                const btn = document.getElementById('themeBtn');
                if (btn) btn.innerHTML = THEME_LABELS[saved];
            }
            const collapsed = localStorage.getItem('toc-collapsed');
            if (collapsed === 'true') {
                document.body.classList.add('toc-collapsed');
            }
            initScrollSpy();
            initHighlight();
        })();
    </script>
</body>
</html>
